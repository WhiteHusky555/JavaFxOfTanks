# Прогоняет тесты Maven (JUnit 5) при каждом push и при каждом pull request в main.
# Использует Maven Wrapper проекта (mvnw), поэтому версия Maven та же, что и при
# локальной сборке, и ставить Maven на раннер отдельно не нужно.

name: Java CI with Maven

on:
  push:
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Make mvnw executable
        run: chmod +x mvnw

      - name: Run tests
        run: ./mvnw -B clean test

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
