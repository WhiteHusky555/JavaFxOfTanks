# Управление игрока: танк не прыгает по сторонам света, а поворачивается
# на месте и едет вперёд/назад вдоль своего курса.
# Значения — имена констант javafx.scene.input.KeyCode; несколько клавиш
# для одного действия перечисляются через запятую. Файл можно менять без
# пересборки исходников — раскладка перечитывается при каждом запуске игры.

move.forward=UP,W
move.backward=DOWN,S
turn.left=LEFT,A
turn.right=RIGHT,D

fire=SPACE
pause=P
back=ESCAPE
