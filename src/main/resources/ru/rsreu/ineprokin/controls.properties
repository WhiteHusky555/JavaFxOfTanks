# Управление: у каждого игрока свой набор клавиш — поворот на месте и
# газ вперёд/назад, как раньше, только руки на клавиатуре не пересекаются.
# Значения — имена констант javafx.scene.input.KeyCode; несколько клавиш
# для одного действия перечисляются через запятую. Файл можно менять без
# пересборки исходников — раскладка перечитывается при каждом запуске игры.

p1.move.forward=W
p1.move.backward=S
p1.turn.left=A
p1.turn.right=D
p1.fire=SPACE

p2.move.forward=UP
p2.move.backward=DOWN
p2.turn.left=LEFT
p2.turn.right=RIGHT
p2.fire=ENTER

pause=P
back=ESCAPE
